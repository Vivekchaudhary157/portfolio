  <body>
    <!--
      Hidden static form so Netlify's build-time bot can detect the
      "contact" form fields. The real, visible form lives inside the
      React app (src/components/Contact.jsx) and submits to Netlify
      via fetch using this same form name and field set.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
